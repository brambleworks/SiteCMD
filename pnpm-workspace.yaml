packages:
  - "apps/*"

# Reject dependency releases less than one day old.
minimumReleaseAge: 1440

# Refuse installs with an unsupported runtime or incompatible dependency engines.
engineStrict: true

# No `overrides:` block. The two that used to live here - a ws dedup floor and
# a sharp floor for GHSA-f88m-g3jw-g9cj - never applied to anything. Neither
# package appears in this workspace's resolved graph at any point in the
# repository history, and the dependents their comments named (ink, miniflare)
# belong to SiteCMD-Web, not here. Both floors therefore had nothing to
# rewrite: dead config that still read like protection.
# guardrail-supply-chain-rules.mjs now fails an override whose dependency is
# absent from the installed graph, so this cannot silently come back.
#
# Adding one back: it must bind a dependency the graph actually caps below the
# floor, and carry an advisory id (or a `non-security:` reason) plus a
# `reviewed:` date. Exact pins additionally require a `pinned-exact:`
# justification, because Renovate does not open PRs against this file.

# Allow only the native build and hook-install scripts the workspace requires.
allowBuilds:
  better-sqlite3: true
  lefthook: true
  esbuild: false
  sharp: false
  workerd: false
