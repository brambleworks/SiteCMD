[[permission]]
identifier = "sitecmd-filesystem-access"
description = "Allows local filesystem and project workspace access, including code scans, export writes, log reads, path resolution, editor open, and reveal actions."
commands.allow = [
    "detect_project_urls",
    "update_project_path",
    "get_git_status",
    "get_commits_since",
    "get_db_path",
    "run_scan_execution",
    "run_code_scan_audit",
    "get_log_path",
    "read_recent_logs",
    "inspect_desktop_watch_files",
    "resolve_project_files",
    "open_path_in_editor",
    "reveal_path",
    "resolve_fix_locations_for_check",
    "register_agent_tool",
    "unregister_agent_tool",
    "launch_agent_handoff"
]
