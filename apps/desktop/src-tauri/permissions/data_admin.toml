[[permission]]
identifier = "sitecmd-data-admin"
description = "Allows destructive SiteCMD data administration operations such as deleting projects, pruning history, importing backups, and removing stored configuration."
commands.allow = [
    "delete_project",
    "delete_environment",
    "import_database",
    "clear_scan_history",
    "delete_scan",
    "delete_site_scans",
    "delete_event",
    "delete_report_history",
    "delete_webhook_config",
    "deactivate_license"
]
