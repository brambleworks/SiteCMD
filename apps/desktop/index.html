<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteCMD</title>
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <script>
      // Apply the locked theme before React renders to prevent a flash.
      document.documentElement.classList.add("dark");
    </script>
    <div id="sitecmd-static-startup" aria-live="polite">
      <div id="sitecmd-static-startup__panel">
        <h1 id="sitecmd-static-startup__title">Loading SiteCMD</h1>
        <p id="sitecmd-static-startup__body">
          SiteCMD is starting your workspace. If the app does not load, reload it. In development,
          make sure the Vite app is already running before you attach Tauri.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
