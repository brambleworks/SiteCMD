name: Feature request
description: Suggest a product or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. Issues and discussion are welcome, but unsolicited pull requests are not accepted yet.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a successful result let the user do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or related tools you have tried.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request contains no credentials, private code, private URLs, scan findings, or customer data.
          required: true
